# قرعه‌کشی — sample nginx server block
server {
    listen 80;
    server_name _;
    root /var/www/luckydraw;
    index index.php;
    charset utf-8;

    location ~ ^/(storage|app)(/|$) { deny all; }
    location ~ /\. { deny all; }                                   # .htaccess, .git, …
    location ~* \.(md|sqlite|json|lock|sh|bat|conf|example\.php)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # adjust to your PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param LD_REWRITE 1;                    # enables pretty URLs (/live/CODE)
    }

    location ~* \.(woff2?|ttf|svg|css|js)$ { expires 7d; add_header Cache-Control "public"; }

    client_max_body_size 1m;
}
